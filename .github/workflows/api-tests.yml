name: Playwright API Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-api-reports
          path: |
            playwright-report/
            allure-results/
            test-results/
          retention-days: 7
